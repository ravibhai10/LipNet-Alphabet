services:
  backend:
    container_name: lipnet-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      LIPNET_ACCESS_FILE: /run/lipnet/access.json
      LIPNET_CPU_THREADS: "1"
    volumes:
      - ./.access:/run/lipnet:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./data/adaptive_private:/app/data/adaptive_private:rw
      - ./test_recordings:/app/test_recordings:rw
      - ./runs:/app/runs:rw
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; raise SystemExit(0 if urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_BASE: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
