[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabet"
version = "0.2.0"
description = "LipNet-Alphabet: Lip reading model supporting A-Z alphabet and 500-word LRW vocabulary"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets==15.0.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
cpu = ["fairseq", "sentencepiece", "python_speech_features==0.6"]
dev = [
    "httpx==0.28.1",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "wandb>=0.15.0",
]

[project.urls]
Homepage = "https://github.com/your-org/lipnet-alphabet"
Documentation = "https://lipnet-alphabet.readthedocs.io/"
Source = "https://github.com/your-org/lipnet-alphabet"
Tracker = "https://github.com/your-org/lipnet-alphabet/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "timeout: test execution timeout",
    "hardware: tests requiring physical hardware",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alphabet*", "data*", "tracking*", "repr*", "config*", "model*", "eval*", "app*", "temporal*", "pipeline*"]

[tool.alphabet]
num_classes = 500
dataset_lrw = "data/lrw"
