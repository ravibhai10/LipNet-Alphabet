[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphabet"
version = "0.2.0"
description = "Alphabet Visual Speech Dataset - Phase 2: Dataset Format + Recording Metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "wandb>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alphabet*", "data*", "tracking*", "repr*", "config*", "model*", "eval*", "app*"]